# .github/workflows/tests.yaml  (na raiz do repositório, que é o próprio projeto)
name: Testes de segurança

# QUANDO O WORKFLOW RODA (gatilhos / eventos)
on:
  push:  

  # Permite rodar na mão: botão "Run workflow" na aba Actions
  workflow_dispatch:

# TAREFAS (JOBS) QUE O WORKFLOW EXECUTA
jobs:  
  pytest:    
    runs-on: ubuntu-24.04   

    steps:
      # 1. Obter o código do repositório
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      # 2. Configurar a versão do Python do projeto
      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      
      # 3. Instala as bibliotecas do projeto (FastAPI, SQLModel, ...)
      - name: Instalar dependências
        run: pip install -r requirements.txt

      # 4. Executar os testes
      # 5. Se algum teste falhar, o pytest termina com erro (exit code 1) e o workflow falha
      - name: Executar testes
        env:
          PYTHONPATH: .
        run: pytest tests/ -v